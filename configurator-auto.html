    <script>
        const dropzoneBox = document.getElementById('dropzone-box');
        const folderInput = document.getElementById('folder-input');
        const appendInput = document.getElementById('append-folder-input');
        const dropzoneSection = document.getElementById('dropzone-section');
        const configuratorSection = document.getElementById('configurator-section');
        
        // ==========================================
        // 全局数据仓库与对比状态 (Store & Comparison State)
        // ==========================================
        let models = {}; 
        let activeModelKey = null;

        const comparisonState = {
            mode: 'single', // 'single' | 'side-by-side' | 'wipe'
            activeSlot: 'A', // 'A' | 'B' (which slot the sidebar currently edits in A/B mode)
            wipePercent: 50,
            isDraggingWipe: false,
            sharedView: 'front45',
            slotA: {
                modelKey: null,
                color: null,
                wheel: null,
                activeBuffer: '1',
                transitionId: 0
            },
            slotB: {
                modelKey: null,
                color: null,
                wheel: null,
                activeBuffer: '1',
                transitionId: 0
            }
        };

        const KNOWN_VIEWS = [
            'front45', 'front34', 'front_45', 'front_34', 'f45', 'f34',
            'rear45', 'rear34', 'rear_45', 'rear_34', 'r45', 'r34',
            'side', 'front', 'rear', 'back', 'top', 'overhead',
            'interior', 'int', 'detail', 'iso'
        ];

        const IGNORED_TAGS = [
            'result', 'final', 'render', 'output', 'export', 'comp', 'composite',
            'autocomposite', 'pipeline', 'preview', 'thumb', 'thumbnail', 'v01', 'v02',
            'v1', 'v2', 'v3', 'web', 'hd', '4k', '2k', '8k', 'clean'
        ];

        const KNOWN_COLORS = [
            'black', 'white', 'silver', 'grey', 'gray', 'red', 'blue', 'green', 
            'yellow', 'pink', 'purple', 'orange', 'brown', 'gold', 'bronze', 
            'beige', 'carbon', 'cyan', 'emerald', 'champagne', 'titanium', 
            'nardo', 'chalk', 'ruby', 'violet', 'arctic', 'metallic', 'matte'
        ];

        const CATEGORY_TAGS = ['ext', 'exterior', 'interior', 'studio', 'cam'];

        const COLOR_MAP = {
            'black': '#111111', 'jet_black': '#0a0a0a', 'matte_black': '#222222',
            'white': '#f5f5f7', 'pearl_white': '#f0efe9', 'chalk': '#d8d7d3',
            'silver': '#c0c0c0', 'grey': '#73787e', 'gray': '#73787e', 'volcano_grey': '#4b4d52',
            'nardo_grey': '#7a7e85', 'quicksilver': '#8c929a', 'titanium': '#878681',
            'red': '#c4151c', 'carmine_red': '#961118', 'guards_red': '#d51b24', 'ultra_red': '#b81424',
            'blue': '#104f9e', 'gentian_blue': '#162e5b', 'miami_blue': '#00a3cc', 'bay_blue': '#225588', 'frozen_blue': '#82a9be', 'deep_blue': '#0e2b4d',
            'green': '#247345', 'python_green': '#46b23a', 'mamba_green': '#1f663c', 'emerald': '#046307',
            'yellow': '#f5b800', 'racing_yellow': '#ffd000',
            'pink': '#e57a9a', 'purple': '#6b2d82', 'orange': '#d9531e', 'brown': '#5c4033',
            'gold': '#d4af37', 'bronze': '#9c6f3d', 'beige': '#d9cca3', 'cyan': '#00b4d8'
        };

        function getColorHex(name) {
            if (!name) return '#666666';
            const low = name.toLowerCase().replace(/\s+/g, '_');
            if (COLOR_MAP[low]) return COLOR_MAP[low];
            for (const key in COLOR_MAP) {
                if (low.includes(key) || key.includes(low)) {
                    return COLOR_MAP[key];
                }
            }
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
            return '#' + '00000'.substring(0, 6 - c.length) + c;
        }

        // ==========================================
        // 核心：智能汽车文件名语义解析器 (Robust Semantic Parser)
        // ==========================================
        function parseCarFilename(filename) {
            const dotIdx = filename.lastIndexOf('.');
            const baseName = dotIdx !== -1 ? filename.substring(0, dotIdx) : filename;
            const rawTokens = baseName.split('_');
            if (rawTokens.length < 2) return null;

            let tokens = [...rawTokens];
            let view = null;
            let wheel = null;
            let brake = null;
            let color = null;
            let category = null;

            // 1. 优先过滤掉无意义的后缀/通用标签 (如 result, final, render, output, web 等)
            tokens = tokens.filter(t => !IGNORED_TAGS.includes(t.toLowerCase()));

            // 2. 识别视角 (View) —— 支持双词组合视角 (如 front_45, rear_34) 与单词视角 (front45, side, rear...)
            for (let i = 0; i < tokens.length - 1; i++) {
                const t1 = tokens[i].toLowerCase();
                const t2 = tokens[i + 1].toLowerCase();
                if (['front', 'rear', 'f', 'r'].includes(t1) && ['45', '34'].includes(t2)) {
                    view = t1 + t2;
                    tokens.splice(i, 2);
                    break;
                }
            }

            if (!view) {
                const viewIdx = tokens.findIndex(t => KNOWN_VIEWS.includes(t.toLowerCase()));
                if (viewIdx !== -1) {
                    view = tokens[viewIdx].toLowerCase();
                    tokens.splice(viewIdx, 1);
                }
            }

            // 3. 识别轮毂 (Wheel / Rim)
            const wheelIdx = tokens.findIndex(t => /^wheel\d*$/i.test(t) || /^rim\d*$/i.test(t) || /^w\d+$/i.test(t));
            if (wheelIdx !== -1) {
                wheel = tokens[wheelIdx].toLowerCase();
                tokens.splice(wheelIdx, 1);
            }

            // 4. 识别刹车卡钳 (Brake / Caliper)
            const brakeIdx = tokens.findIndex(t => /^brake\d*$/i.test(t) || /^caliper\d*$/i.test(t) || /^b\d+$/i.test(t));
            if (brakeIdx !== -1) {
                brake = tokens[brakeIdx].toLowerCase();
                tokens.splice(brakeIdx, 1);
            }

            // 5. 识别车漆颜色 (Color)
            const colorIdx = tokens.findIndex(t => KNOWN_COLORS.includes(t.toLowerCase()));
            if (colorIdx !== -1) {
                color = tokens[colorIdx].toLowerCase();
                tokens.splice(colorIdx, 1);
            }

            // 6. 识别分类标签 (EXT / INT)
            const catIdx = tokens.findIndex(t => CATEGORY_TAGS.includes(t.toLowerCase()));
            if (catIdx !== -1) {
                category = tokens[catIdx].toUpperCase();
                tokens.splice(catIdx, 1);
            }

            // 7. 若未匹配已知颜色词库，取最后一个剩余词作为颜色容错
            if (!color) {
                if (tokens.length >= 2) {
                    color = tokens.pop().toLowerCase();
                } else if (tokens.length === 1) {
                    color = tokens[0].toLowerCase();
                    tokens = [];
                }
            }

            // 8. 剩余全部词段合并为车型名称 (Model)
            let model = tokens.length > 0 ? tokens.join(' ') : 'AUTO';

            if (!wheel) wheel = 'wheel1';
            if (!color) color = 'default';
            if (!view) view = 'front45';

            return {
                model,
                category,
                color,
                wheel,
                brake,
                view,
                key: `${color}_${wheel}_${view}`
            };
        }

        function resetApp() {
            dropzoneSection.style.display = 'flex';
            configuratorSection.style.display = 'none';
            models = {};
            activeModelKey = null;
            comparisonState.mode = 'single';
            comparisonState.activeSlot = 'A';
            if (folderInput) folderInput.value = '';
            if (appendInput) appendInput.value = '';
            const tabsBar = document.getElementById('model-tabs-bar');
            if (tabsBar) {
                tabsBar.innerHTML = '';
                tabsBar.style.display = 'none';
            }
            const modeSelector = document.getElementById('view-mode-selector');
            if (modeSelector) modeSelector.style.display = 'none';
            const addBtn = document.getElementById('btn-add-model');
            if (addBtn) addBtn.style.display = 'none';
            const abActions = document.getElementById('ab-quick-actions');
            if (abActions) abActions.style.display = 'none';
            const titleEl = document.getElementById('car-title');
            if (titleEl) titleEl.innerText = 'AUTO CONFIGURATOR';
        }

        // ==========================================
        // 拖拽与本地文件夹读取引擎
        // ==========================================
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        window.addEventListener('drop', async (e) => {
            e.preventDefault();
            const dt = e.dataTransfer;
            if (!dt) return;

            const isAlreadyActive = configuratorSection.style.display !== 'none';
            let files = [];
            if (dt.items && dt.items.length > 0) {
                files = await scanDataTransferItems(dt.items);
            } else if (dt.files && dt.files.length > 0) {
                files = dt.files;
            }

            if (files && files.length > 0) {
                handleFiles(files, isAlreadyActive);
            }
        });

        if (dropzoneBox) {
            dropzoneBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzoneBox.classList.add('dragover');
            });
            dropzoneBox.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropzoneBox.classList.remove('dragover');
            });
            dropzoneBox.addEventListener('drop', (e) => {
                dropzoneBox.classList.remove('dragover');
            });
        }

        if (folderInput) {
            folderInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFiles(e.target.files, false);
                    e.target.value = '';
                }
            });
        }

        if (appendInput) {
            appendInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFiles(e.target.files, true);
                    e.target.value = '';
                }
            });
        }

        async function scanDataTransferItems(items) {
            const files = [];
            const queue = [];

            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (typeof item.webkitGetAsEntry === 'function') {
                    const entry = item.webkitGetAsEntry();
                    if (entry) queue.push(entry);
                } else if (typeof item.getAsFile === 'function') {
                    const f = item.getAsFile();
                    if (f) files.push(f);
                }
            }

            while (queue.length > 0) {
                const entry = queue.shift();
                if (entry.isFile) {
                    const f = await new Promise(resolve => entry.file(resolve, () => resolve(null)));
                    if (f) files.push(f);
                } else if (entry.isDirectory) {
                    const dirReader = entry.createReader();
                    const readEntries = async () => {
                        const entries = await new Promise(resolve => dirReader.readEntries(resolve, () => resolve([])));
                        if (entries && entries.length > 0) {
                            for (const child of entries) queue.push(child);
                            await readEntries();
                        }
                    };
                    await readEntries();
                }
            }

            return files;
        }

        // ==========================================
        // 核心：多车型文件汇入与分组解析引擎 (Multi-Model Ingestion)
        // ==========================================
        function handleFiles(files, isAppend = false) {
            if (!isAppend) {
                models = {};
                activeModelKey = null;
            }

            const newlyDiscoveredModels = new Set();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const path = file.webkitRelativePath || file.name;
                const fileName = path.split(/[\/\\]/).pop();
                
                if (!/\.(png|jpe?g|webp|bmp)$/i.test(fileName)) continue;

                const parsed = parseCarFilename(fileName);
                if (!parsed) continue;

                const mKey = parsed.model;
                if (!models[mKey]) {
                    models[mKey] = {
                        modelKey: mKey,
                        displayName: mKey.toUpperCase(),
                        files: [],
                        fileMap: {},
                        colorSet: new Set(),
                        wheelSet: new Set(),
                        viewSet: new Set(),
                        colors: [],
                        wheels: [],
                        views: []
                    };
                }

                models[mKey].files.push(file);
                models[mKey].fileMap[parsed.key] = file;
                models[mKey].colorSet.add(parsed.color);
                models[mKey].wheelSet.add(parsed.wheel);
                models[mKey].viewSet.add(parsed.view);
                newlyDiscoveredModels.add(mKey);
            }

            const modelKeys = Object.keys(models);
            if (modelKeys.length === 0) {
                showToast("No valid car rendering files recognized.");
                return;
            }

            const VIEW_ORDER = ['front45', 'side', 'rear45', 'rear', 'front', 'top', 'interior'];
            modelKeys.forEach(mKey => {
                const m = models[mKey];
                m.views = Array.from(m.viewSet).sort((a, b) => {
                    const idxA = VIEW_ORDER.indexOf(a.toLowerCase());
                    const idxB = VIEW_ORDER.indexOf(b.toLowerCase());
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });
                m.colors = Array.from(m.colorSet).sort();
                m.wheels = Array.from(m.wheelSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            });

            // 初始化全局活跃车型与 A/B 对照组槽位
            if (!activeModelKey || !models[activeModelKey]) {
                activeModelKey = Array.from(newlyDiscoveredModels)[0] || modelKeys[0];
            } else if (isAppend && newlyDiscoveredModels.size > 0) {
                activeModelKey = Array.from(newlyDiscoveredModels)[0];
            }

            // 初始化 Slot A 与 Slot B 默认配置
            const mA = models[activeModelKey] || models[modelKeys[0]];
            comparisonState.sharedView = mA.views.includes('front45') ? 'front45' : mA.views[0];

            if (!comparisonState.slotA.modelKey || !models[comparisonState.slotA.modelKey]) {
                comparisonState.slotA.modelKey = mA.modelKey;
                comparisonState.slotA.color = mA.colors[0];
                comparisonState.slotA.wheel = mA.wheels[0];
            }

            if (!comparisonState.slotB.modelKey || !models[comparisonState.slotB.modelKey]) {
                const mBKey = modelKeys.length > 1 ? modelKeys[1] : modelKeys[0];
                const mB = models[mBKey];
                comparisonState.slotB.modelKey = mBKey;
                comparisonState.slotB.color = (mBKey === comparisonState.slotA.modelKey && mB.colors.length > 1) ? mB.colors[1] : mB.colors[0];
                comparisonState.slotB.wheel = (mBKey === comparisonState.slotA.modelKey && mB.wheels.length > 1) ? mB.wheels[1] : mB.wheels[0];
            }

            dropzoneSection.style.display = 'none';
            configuratorSection.style.display = 'block';

            // 显示模式选择器
            const modeSelector = document.getElementById('view-mode-selector');
            if (modeSelector) modeSelector.style.display = 'flex';

            renderModelTabs();
            setComparisonMode(comparisonState.mode, true);
            initWipeDragEvents();
            initPanZoomEvents();

            showToast(`Loaded ${modelKeys.length} model(s): ${modelKeys.join(', ')}`);
        }

        // ==========================================
        // 核心：模式切换与对照组控制 (Comparison Modes)
        // ==========================================
        function setComparisonMode(mode, isInitial = false) {
            comparisonState.mode = mode;

            // 1. 更新顶部模式切换药丸按钮高亮
            document.querySelectorAll('.mode-pill-btn').forEach(btn => {
                btn.classList.toggle('active', 
                    (mode === 'single' && btn.id === 'btn-mode-single') ||
                    (mode === 'side-by-side' && btn.id === 'btn-mode-split') ||
                    (mode === 'wipe' && btn.id === 'btn-mode-wipe')
                );
            });

            const tabsBar = document.getElementById('model-tabs-bar');
            const abActions = document.getElementById('ab-quick-actions');
            const slotSelectCard = document.getElementById('slot-select-card');
            const slotModelCard = document.getElementById('slot-model-card');
            const mainStageCard = document.getElementById('main-stage-card');
            const dualStageGrid = document.getElementById('dual-stage-grid');
            const wipeViewportB = document.getElementById('stage-viewport-wipe-b');
            const wipeDivider = document.getElementById('wipe-divider');
            const badgeTagA = document.getElementById('badge-tag-a');

            if (mode === 'single') {
                if (tabsBar) tabsBar.style.display = 'flex';
                if (abActions) abActions.style.display = 'none';
                if (slotSelectCard) slotSelectCard.style.display = 'none';
                if (slotModelCard) slotModelCard.style.display = 'none';

                if (mainStageCard) mainStageCard.style.display = 'block';
                if (dualStageGrid) dualStageGrid.style.display = 'none';
                if (wipeViewportB) wipeViewportB.style.display = 'none';
                if (wipeDivider) wipeDivider.style.display = 'none';
                if (badgeTagA) badgeTagA.style.display = 'none';

                comparisonState.slotA.modelKey = activeModelKey;
                const curM = models[activeModelKey];
                if (curM) {
                    if (!curM.colors.includes(comparisonState.slotA.color)) comparisonState.slotA.color = curM.colors[0];
                    if (!curM.wheels.includes(comparisonState.slotA.wheel)) comparisonState.slotA.wheel = curM.wheels[0];
                }

                buildUI();
                updateSlotRender('A', isInitial);
            } else if (mode === 'side-by-side') {
                if (tabsBar) tabsBar.style.display = 'none';
                if (abActions) abActions.style.display = 'flex';
                if (slotSelectCard) slotSelectCard.style.display = 'flex';
                if (slotModelCard) slotModelCard.style.display = 'block';

                if (mainStageCard) mainStageCard.style.display = 'none';
                if (dualStageGrid) dualStageGrid.style.display = 'grid';
                if (wipeViewportB) wipeViewportB.style.display = 'none';
                if (wipeDivider) wipeDivider.style.display = 'none';

                updateSlotSwitcherUI();
                buildUI();
                updateSlotRender('A', isInitial);
                updateSlotRender('B', isInitial);
            } else if (mode === 'wipe') {
                if (tabsBar) tabsBar.style.display = 'none';
                if (abActions) abActions.style.display = 'flex';
                if (slotSelectCard) slotSelectCard.style.display = 'flex';
                if (slotModelCard) slotModelCard.style.display = 'block';

                if (mainStageCard) mainStageCard.style.display = 'block';
                if (dualStageGrid) dualStageGrid.style.display = 'none';
                if (wipeViewportB) wipeViewportB.style.display = 'block';
                if (wipeDivider) wipeDivider.style.display = 'block';
                if (badgeTagA) badgeTagA.style.display = 'flex';

                updateWipePosition();
                updateSlotSwitcherUI();
                buildUI();
                updateSlotRender('A', isInitial);
                updateSlotRender('B', isInitial);
            }

            buildThumbnails();
        }
        window.setComparisonMode = setComparisonMode;

        // 切换当前侧边栏正在编辑的槽位 (A or B)
        function setActiveSlot(slot) {
            comparisonState.activeSlot = slot;
            updateSlotSwitcherUI();
            buildUI();
        }
        window.setActiveSlot = setActiveSlot;

        function updateSlotSwitcherUI() {
            const btnA = document.getElementById('btn-slot-a');
            const btnB = document.getElementById('btn-slot-b');
            const cardA = document.getElementById('dual-card-a');
            const cardB = document.getElementById('dual-card-b');

            if (btnA && btnB) {
                btnA.classList.toggle('active', comparisonState.activeSlot === 'A');
                btnB.classList.toggle('active', comparisonState.activeSlot === 'B');
            }
            if (cardA && cardB) {
                cardA.classList.toggle('active-slot', comparisonState.activeSlot === 'A');
                cardB.classList.toggle('active-slot', comparisonState.activeSlot === 'B');
            }

            const descA = document.getElementById('slot-desc-a');
            const descB = document.getElementById('slot-desc-b');
            const mA = models[comparisonState.slotA.modelKey];
            const mB = models[comparisonState.slotB.modelKey];
            if (descA && mA) descA.innerText = `${mA.displayName} · ${comparisonState.slotA.color}`;
            if (descB && mB) descB.innerText = `${mB.displayName} · ${comparisonState.slotB.color}`;
        }

        // 互换 A/B 槽位
        function swapSlots() {
            const temp = { ...comparisonState.slotA };
            comparisonState.slotA = { ...comparisonState.slotB };
            comparisonState.slotB = temp;

            updateSlotSwitcherUI();
            buildUI();
            updateSlotRender('A');
            updateSlotRender('B');
            showToast("Swapped Vehicle A ⇄ Vehicle B");
        }
        window.swapSlots = swapSlots;

        // 一键将另一槽位设置为同款车型 (方便快速对比颜色/轮毂)
        function cloneSlotToOther() {
            const sourceSlot = comparisonState.activeSlot === 'A' ? comparisonState.slotA : comparisonState.slotB;
            const targetSlot = comparisonState.activeSlot === 'A' ? comparisonState.slotB : comparisonState.slotA;
            const targetSlotName = comparisonState.activeSlot === 'A' ? 'B' : 'A';
            const m = models[sourceSlot.modelKey];
            if (!m) return;

            targetSlot.modelKey = sourceSlot.modelKey;
            const otherColor = m.colors.find(c => c !== sourceSlot.color) || m.colors[0];
            const otherWheel = m.wheels.find(w => w !== sourceSlot.wheel) || m.wheels[0];
            targetSlot.color = otherColor;
            targetSlot.wheel = otherWheel;

            updateSlotSwitcherUI();
            buildUI();
            updateSlotRender(targetSlotName);
            showToast(`Matched Slot ${targetSlotName} to ${m.displayName} (${otherColor.toUpperCase()})`);
        }
        window.cloneSlotToOther = cloneSlotToOther;

        // 帘幕滑动条位置更新
        function updateWipePosition() {
            const p = comparisonState.wipePercent;
            const wipeDivider = document.getElementById('wipe-divider');
            const wipeViewportB = document.getElementById('stage-viewport-wipe-b');

            if (wipeDivider) wipeDivider.style.left = `${p}%`;
            if (wipeViewportB) {
                wipeViewportB.style.clipPath = `polygon(${p}% 0, 100% 0, 100% 100%, ${p}% 100%)`;
            }
        }

        function initWipeDragEvents() {
            const mainStage = document.getElementById('main-stage-card');
            const divider = document.getElementById('wipe-divider');
            if (!mainStage || !divider) return;

            const onPointerMove = (e) => {
                if (!comparisonState.isDraggingWipe) return;
                const rect = mainStage.getBoundingClientRect();
                const x = e.clientX - rect.left;
                let percent = (x / rect.width) * 100;
                percent = Math.max(2, Math.min(98, percent));
                comparisonState.wipePercent = percent;
                updateWipePosition();
            };

            const onPointerUp = () => {
                if (comparisonState.isDraggingWipe) {
                    comparisonState.isDraggingWipe = false;
                    document.body.style.userSelect = '';
                }
            };

            divider.addEventListener('pointerdown', (e) => {
                if (comparisonState.mode !== 'wipe') return;
                comparisonState.isDraggingWipe = true;
                document.body.style.userSelect = 'none';
                e.stopPropagation();
            });

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('pointercancel', onPointerUp);
        }

        // ==========================================
        // 顶部单车模型标签栏 (Model Tabs)
        // ==========================================
        function renderModelTabs() {
            const tabsBar = document.getElementById('model-tabs-bar');
            const addBtn = document.getElementById('btn-add-model');
            if (!tabsBar) return;

            const modelKeys = Object.keys(models);
            if (modelKeys.length > 0) {
                tabsBar.style.display = comparisonState.mode === 'single' ? 'flex' : 'none';
                if (addBtn) addBtn.style.display = 'inline-flex';
            } else {
                tabsBar.style.display = 'none';
                if (addBtn) addBtn.style.display = 'none';
                return;
            }

            tabsBar.innerHTML = '';
            modelKeys.forEach(mKey => {
                const m = models[mKey];
                const btn = document.createElement('button');
                btn.className = `model-tab-btn ${mKey === activeModelKey ? 'active' : ''}`;
                btn.dataset.model = mKey;
                btn.onclick = () => switchSingleModel(mKey);
                btn.innerHTML = `<span>${m.displayName}</span>`;
                tabsBar.appendChild(btn);
            });
        }

        function switchSingleModel(mKey) {
            if (!models[mKey] || mKey === activeModelKey) return;
            activeModelKey = mKey;
            comparisonState.slotA.modelKey = mKey;

            const curM = models[mKey];
            if (!curM.colors.includes(comparisonState.slotA.color)) comparisonState.slotA.color = curM.colors[0];
            if (!curM.wheels.includes(comparisonState.slotA.wheel)) comparisonState.slotA.wheel = curM.wheels[0];

            document.querySelectorAll('.model-tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.model === mKey);
            });

            const titleEl = document.getElementById('car-title');
            if (titleEl) titleEl.innerText = models[mKey].displayName + ' CONFIGURATOR';

            buildUI();
            updateSlotRender('A');
        }
        window.switchSingleModel = switchSingleModel;

        function getActiveSlotConfig() {
            if (comparisonState.mode === 'single') {
                return {
                    slot: 'A',
                    config: comparisonState.slotA,
                    model: models[activeModelKey] || models[Object.keys(models)[0]]
                };
            }
            const isSlotA = comparisonState.activeSlot === 'A';
            const cfg = isSlotA ? comparisonState.slotA : comparisonState.slotB;
            return {
                slot: comparisonState.activeSlot,
                config: cfg,
                model: models[cfg.modelKey] || models[Object.keys(models)[0]]
            };
        }

        // ==========================================
        // 智能文件匹配与缺省降级引擎 (Fallback Engine)
        // ==========================================
        function getFileForState(modelKey, color, wheel, view) {
            const m = models[modelKey];
            if (!m || !color || !view) return null;
            const fileMap = m.fileMap;
            const uniqueWheels = m.wheels;

            if (wheel) {
                const exactKey = `${color}_${wheel}_${view}`;
                if (fileMap[exactKey]) return fileMap[exactKey];
            }
            
            if (uniqueWheels && uniqueWheels.length > 0) {
                const wheel1Candidate = uniqueWheels.find(w => w.toLowerCase().includes('1')) || uniqueWheels[0];
                const wheel1Key = `${color}_${wheel1Candidate}_${view}`;
                if (fileMap[wheel1Key]) return fileMap[wheel1Key];

                for (const w of uniqueWheels) {
                    const wKey = `${color}_${w}_${view}`;
                    if (fileMap[wKey]) return fileMap[wKey];
                }
            }
            
            for (const key in fileMap) {
                const parts = key.split('_');
                if (parts[0] === color && parts[2] === view) {
                    return fileMap[key];
                }
            }
            
            for (const key in fileMap) {
                const parts = key.split('_');
                if (parts[2] === view) {
                    return fileMap[key];
                }
            }

            return null;
        }

        function getWheelPreviewFile(modelKey, color, wheel) {
            const m = models[modelKey];
            if (!m) return null;
            const fileMap = m.fileMap;
            const preferredViews = ['side', 'front45', 'rear45', m.views[0]];
            for (const v of preferredViews) {
                const key = `${color}_${wheel}_${v}`;
                if (fileMap[key]) return fileMap[key];
            }
            for (const key in fileMap) {
                const parts = key.split('_');
                if (parts[1] === wheel) {
                    return fileMap[key];
                }
            }
            return getFileForState(modelKey, color, wheel, comparisonState.sharedView);
        }

        // ==========================================
        // UI 动态构建与选配同步 (Dynamic UI Renderer)
        // ==========================================
        function buildUI() {
            const { slot, config, model: m } = getActiveSlotConfig();
            if (!m) return;

            const titleEl = document.getElementById('car-title');
            if (titleEl) {
                if (comparisonState.mode === 'single') {
                    titleEl.innerText = m.displayName + ' CONFIGURATOR';
                } else {
                    titleEl.innerText = `A/B COMPARISON · EDITING SLOT ${slot}`;
                }
            }

            const modelCard = document.getElementById('slot-model-card');
            const modelGrid = document.getElementById('slot-model-pill-grid');
            const curModelLbl = document.getElementById('lbl-cur-slot-model');
            const modelKeys = Object.keys(models);

            if (modelCard && modelGrid && curModelLbl) {
                if (comparisonState.mode !== 'single' && modelKeys.length > 1) {
                    modelCard.style.display = 'block';
                    curModelLbl.innerText = m.displayName;
                    modelGrid.innerHTML = '';
                    modelKeys.forEach(mKey => {
                        const pill = document.createElement('button');
                        pill.className = `model-choice-pill ${mKey === config.modelKey ? 'active' : ''}`;
                        pill.innerText = models[mKey].displayName;
                        pill.onclick = () => setSlotModel(slot, mKey);
                        modelGrid.appendChild(pill);
                    });
                } else {
                    modelCard.style.display = 'none';
                }
            }

            const colorContainer = document.getElementById('dynamic-colors');
            colorContainer.innerHTML = '';
            m.colors.forEach(color => {
                const hex = getColorHex(color);
                const isActive = color === config.color ? 'active' : '';
                const tile = document.createElement('div');
                tile.className = `swatch-tile ${isActive}`;
                tile.dataset.color = color;
                tile.onclick = () => setColor(color);
                tile.innerHTML = `
                    <div class="swatch-rect" style="background: ${hex};"></div>
                    <span class="swatch-name">${color}</span>
                `;
                colorContainer.appendChild(tile);
            });

            const wheelContainer = document.getElementById('dynamic-wheels');
            wheelContainer.innerHTML = '';
            m.wheels.forEach(wheel => {
                const isActive = wheel === config.wheel ? 'active' : '';
                const card = document.createElement('div');
                card.className = `wheel-option-card ${isActive}`;
                card.dataset.wheel = wheel;
                card.onclick = () => setWheel(wheel);
                
                const previewFile = getWheelPreviewFile(config.modelKey, config.color, wheel);
                const previewUrl = previewFile ? URL.createObjectURL(previewFile) : '';

                card.innerHTML = `
                    <div class="wheel-option-thumb"><img src="${previewUrl}" alt="${wheel}"></div>
                    <div class="wheel-option-info">
                        <h4>${wheel.toUpperCase()}</h4>
                        <p>Factory Equipment</p>
                    </div>
                `;
                wheelContainer.appendChild(card);
            });

            buildThumbnails();
            updateLabels();
        }

        function setSlotModel(slot, mKey) {
            const cfg = slot === 'A' ? comparisonState.slotA : comparisonState.slotB;
            if (!models[mKey] || cfg.modelKey === mKey) return;
            cfg.modelKey = mKey;
            const newM = models[mKey];
            if (!newM.colors.includes(cfg.color)) cfg.color = newM.colors[0];
            if (!newM.wheels.includes(cfg.wheel)) cfg.wheel = newM.wheels[0];

            updateSlotSwitcherUI();
            buildUI();
            updateSlotRender(slot);
        }

        function buildThumbnails() {
            const { config, model: m } = getActiveSlotConfig();
            if (!m) return;

            const allViewsSet = new Set();
            Object.values(models).forEach(mod => mod.views.forEach(v => allViewsSet.add(v)));
            const VIEW_ORDER = ['front45', 'side', 'rear45', 'rear', 'front', 'top', 'interior'];
            const allViews = Array.from(allViewsSet).sort((a, b) => {
                const idxA = VIEW_ORDER.indexOf(a.toLowerCase());
                const idxB = VIEW_ORDER.indexOf(b.toLowerCase());
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                if (idxA !== -1) return -1;
                if (idxB !== -1) return 1;
                return a.localeCompare(b);
            });

            const thumbContainer = document.getElementById('dynamic-thumbnails');
            thumbContainer.innerHTML = '';
            allViews.forEach(view => {
                const isActive = view === comparisonState.sharedView ? 'active' : '';
                const card = document.createElement('div');
                card.className = `thumb-card ${isActive}`;
                card.dataset.view = view;
                card.onclick = () => setView(view);
                
                const file = getFileForState(config.modelKey, config.color, config.wheel, view);
                const url = file ? URL.createObjectURL(file) : '';

                card.innerHTML = `<img class="thumb-img" src="${url}" alt="${view}">`;
                thumbContainer.appendChild(card);
            });
        }

        function updateThumbnails() {
            const { config } = getActiveSlotConfig();
            document.querySelectorAll('.thumb-card').forEach(card => {
                const view = card.dataset.view;
                const img = card.querySelector('.thumb-img');
                const file = getFileForState(config.modelKey, config.color, config.wheel, view);
                if (file && img) {
                    img.src = URL.createObjectURL(file);
                }
            });
        }

        function updateWheelThumbnails() {
            const { config } = getActiveSlotConfig();
            document.querySelectorAll('.wheel-option-card').forEach(card => {
                const wheel = card.dataset.wheel;
                const img = card.querySelector('img');
                const file = getWheelPreviewFile(config.modelKey, config.color, wheel);
                if (file && img) {
                    img.src = URL.createObjectURL(file);
                }
            });
        }

        function updateLabels() {
            const { config } = getActiveSlotConfig();
            const colorLbl = document.getElementById('lbl-color');
            const wheelLbl = document.getElementById('lbl-wheel');
            if (colorLbl) colorLbl.innerText = config.color ? config.color.toUpperCase() : '';
            if (wheelLbl) wheelLbl.innerText = config.wheel ? config.wheel.toUpperCase() : '';
        }

        function setColor(color) {
            const { slot, config } = getActiveSlotConfig();
            if (config.color === color) return;
            config.color = color;

            document.querySelectorAll('.swatch-tile').forEach(el => {
                el.classList.toggle('active', el.dataset.color === color);
            });

            updateSlotSwitcherUI();
            updateLabels();
            updateWheelThumbnails();
            updateThumbnails();
            updateSlotRender(slot);
        }

        function setWheel(wheel) {
            const { slot, config } = getActiveSlotConfig();
            if (config.wheel === wheel) return;
            config.wheel = wheel;

            document.querySelectorAll('.wheel-option-card').forEach(el => {
                el.classList.toggle('active', el.dataset.wheel === wheel);
            });

            updateSlotSwitcherUI();
            updateLabels();
            updateThumbnails();
            updateSlotRender(slot);
        }

        function setView(view) {
            if (comparisonState.sharedView === view) return;
            comparisonState.sharedView = view;

            document.querySelectorAll('.thumb-card').forEach(el => {
                el.classList.toggle('active', el.dataset.view === view);
            });

            if (comparisonState.mode === 'single') {
                updateSlotRender('A');
            } else {
                updateSlotRender('A');
                updateSlotRender('B');
            }
        }

        // ==========================================
        // 核心渲染引擎：槽位双缓冲无黑屏叠化
        // ==========================================
        async function updateSlotRender(slot, isInitial = false) {
            const cfg = slot === 'A' ? comparisonState.slotA : comparisonState.slotB;
            const currentTransitionId = ++cfg.transitionId;
            const spinner = document.getElementById('stage-spinner');

            const file = getFileForState(cfg.modelKey, cfg.color, cfg.wheel, comparisonState.sharedView);
            if (!file) return;
            const targetUrl = URL.createObjectURL(file);

            const modelObj = models[cfg.modelKey];
            const badgeText = `${slot === 'A' ? 'SLOT A' : 'SLOT B'}: ${modelObj ? modelObj.displayName : ''} · ${cfg.color.toUpperCase()}`;
            
            const badgeTagA = document.getElementById('badge-tag-a');
            const badgeTagWipeB = document.getElementById('badge-tag-wipe-b');
            const badgeDualA = document.getElementById('badge-dual-a');
            const badgeDualB = document.getElementById('badge-dual-b');

            if (slot === 'A') {
                if (badgeTagA) badgeTagA.innerText = badgeText;
                if (badgeDualA) badgeDualA.innerText = badgeText;
            } else {
                if (badgeTagWipeB) badgeTagWipeB.innerText = badgeText;
                if (badgeDualB) badgeDualB.innerText = badgeText;
            }

            let img1, img2;
            if (comparisonState.mode === 'side-by-side') {
                img1 = document.getElementById(slot === 'A' ? 'stage-img-dual-a1' : 'stage-img-dual-b1');
                img2 = document.getElementById(slot === 'A' ? 'stage-img-dual-a2' : 'stage-img-dual-b2');
            } else if (comparisonState.mode === 'wipe') {
                img1 = document.getElementById(slot === 'A' ? 'stage-img-a1' : 'stage-img-b1');
                img2 = document.getElementById(slot === 'A' ? 'stage-img-a2' : 'stage-img-b2');
            } else { // single
                img1 = document.getElementById('stage-img-a1');
                img2 = document.getElementById('stage-img-a2');
            }

            if (!img1 || !img2) return;

            const currentVisibleImg = cfg.activeBuffer === '1' ? img1 : img2;
            const incomingImg = cfg.activeBuffer === '1' ? img2 : img1;

            if (isInitial) {
                currentVisibleImg.src = targetUrl;
                currentVisibleImg.style.zIndex = '2';
                currentVisibleImg.style.opacity = '1';
                incomingImg.style.zIndex = '1';
                incomingImg.style.opacity = '0';
                return;
            }

            if (spinner && comparisonState.mode !== 'side-by-side') spinner.classList.add('loading');
            
            const tempImg = new Image();
            tempImg.src = targetUrl;
            await new Promise((resolve) => {
                tempImg.onload = resolve;
                tempImg.onerror = resolve;
            });
            
            if (spinner) spinner.classList.remove('loading');
            if (currentTransitionId !== cfg.transitionId) return;

            currentVisibleImg.style.transition = 'none';
            currentVisibleImg.style.zIndex = '1';
            currentVisibleImg.style.opacity = '1';

            incomingImg.style.transition = 'none';
            incomingImg.style.zIndex = '2';
            incomingImg.style.opacity = '0';
            incomingImg.src = targetUrl;

            void incomingImg.offsetWidth;
            incomingImg.style.transition = 'opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
            incomingImg.style.opacity = '1';

            cfg.activeBuffer = cfg.activeBuffer === '1' ? '2' : '1';

            setTimeout(() => {
                if (currentVisibleImg.src && currentVisibleImg.src.startsWith('blob:')) {
                    URL.revokeObjectURL(currentVisibleImg.src);
                }
            }, 500);
        }

        // ==========================================
        // 核心交互：滚轮缩放与鼠标拖拽平移引擎
        // ==========================================
        const panZoom = { scale: 1, minScale: 1, maxScale: 4.5, x: 0, y: 0, isDragging: false, startX: 0, startY: 0 };
        function clampPanZoom() {
            if (panZoom.scale <= 1) { panZoom.x = 0; panZoom.y = 0; return; }
            const viewport = document.getElementById('stage-viewport-a');
            if (!viewport) return;
            const rect = viewport.getBoundingClientRect();
            const maxX = (rect.width * (panZoom.scale - 1)) / 2;
            const maxY = (rect.height * (panZoom.scale - 1)) / 2;
            panZoom.x = Math.max(-maxX, Math.min(maxX, panZoom.x));
            panZoom.y = Math.max(-maxY, Math.min(maxY, panZoom.y));
        }
        function applyPanZoom(isInstant = false) {
            const layers = [
                document.getElementById('panzoom-layer-a'),
                document.getElementById('panzoom-layer-wipe-b'),
                document.getElementById('panzoom-layer-dual-a'),
                document.getElementById('panzoom-layer-dual-b')
            ];
            const viewport = document.getElementById('stage-viewport-a');
            const badge = document.getElementById('zoom-badge');

            layers.forEach(layer => {
                if (!layer) return;
                if (isInstant) layer.classList.add('dragging');
                else layer.classList.remove('dragging');
                layer.style.transform = `translate3d(${panZoom.x}px, ${panZoom.y}px, 0) scale(${panZoom.scale})`;
            });

            if (viewport) viewport.classList.toggle('can-drag', panZoom.scale > 1.02);
            if (badge) badge.innerText = Math.round(panZoom.scale * 100) + '%';
        }
        function resetZoom(animate = true) {
            panZoom.scale = 1; panZoom.x = 0; panZoom.y = 0; panZoom.isDragging = false;
            applyPanZoom(!animate);
        }
        window.handleZoomStep = function(delta) {
            const targetScale = panZoom.scale + delta;
            const newScale = Math.min(Math.max(targetScale, panZoom.minScale), panZoom.maxScale);
            if (newScale <= 1.02) resetZoom(true);
            else { panZoom.scale = newScale; clampPanZoom(); applyPanZoom(false); }
        };
        function initPanZoomEvents() {
            const viewports = [
                document.getElementById('stage-viewport-a'),
                document.getElementById('dual-card-a'),
                document.getElementById('dual-card-b')
            ];

            viewports.forEach(viewport => {
                if (!viewport || viewport.dataset.panZoomInitialized) return;
                viewport.dataset.panZoomInitialized = 'true';

                viewport.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = viewport.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left - rect.width / 2;
                    const mouseY = e.clientY - rect.top - rect.height / 2;
                    const zoomIntensity = 0.0018;
                    let newScale = panZoom.scale * (1 - e.deltaY * zoomIntensity);
                    newScale = Math.min(Math.max(newScale, panZoom.minScale), panZoom.maxScale);
                    if (newScale <= 1.02) { panZoom.scale = 1; panZoom.x = 0; panZoom.y = 0; }
                    else {
                        const ratio = newScale / panZoom.scale;
                        panZoom.x = mouseX - (mouseX - panZoom.x) * ratio;
                        panZoom.y = mouseY - (mouseY - panZoom.y) * ratio;
                        panZoom.scale = newScale;
                        clampPanZoom();
                    }
                    applyPanZoom(false);
                }, { passive: false });

                viewport.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0 || panZoom.scale <= 1.02) return;
                    panZoom.isDragging = true; panZoom.startX = e.clientX - panZoom.x; panZoom.startY = e.clientY - panZoom.y;
                    viewport.classList.add('is-dragging'); viewport.setPointerCapture(e.pointerId);
                });

                viewport.addEventListener('pointermove', (e) => {
                    if (!panZoom.isDragging) return;
                    panZoom.x = e.clientX - panZoom.startX; panZoom.y = e.clientY - panZoom.startY;
                    clampPanZoom(); applyPanZoom(true);
                });

                const endDrag = (e) => {
                    if (panZoom.isDragging) {
                        panZoom.isDragging = false; viewport.classList.remove('is-dragging'); applyPanZoom(false);
                        try { viewport.releasePointerCapture(e.pointerId); } catch(err) {}
                    }
                };

                viewport.addEventListener('pointerup', endDrag);
                viewport.addEventListener('pointercancel', endDrag);
                viewport.addEventListener('dblclick', (e) => {
                    if (panZoom.scale > 1.2) resetZoom(true);
                    else {
                        const rect = viewport.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left - rect.width / 2;
                        const mouseY = e.clientY - rect.top - rect.height / 2;
                        panZoom.scale = 2.2; panZoom.x = -mouseX * 0.7; panZoom.y = -mouseY * 0.7;
                        clampPanZoom(); applyPanZoom(false);
                    }
                });
            });
        }

        // --- 全屏与 Toast 提示 ---
        window.toggleFullscreen = function() {
            const stage = comparisonState.mode === 'side-by-side' ? document.getElementById('dual-stage-grid') : document.getElementById('main-stage-card');
            if (!document.fullscreenElement) { if (stage.requestFullscreen) stage.requestFullscreen(); }
            else { if (document.exitFullscreen) document.exitFullscreen(); }
        };
        document.addEventListener('fullscreenchange', () => {
            const btn = document.querySelector('.stage-expand-btn');
            if (!btn) return;
            if (!document.fullscreenElement) btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>`;
            else btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>`;
        });

        function showToast(msg) {
            const toast = document.getElementById('toast-notify');
            const msgEl = document.getElementById('toast-msg');
            if (!toast || !msgEl) return;
            msgEl.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3200);
        }
    </script>
    <script src="lang.js"></script>
</body>
